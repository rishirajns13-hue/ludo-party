<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#8f6bff">
  <title>Ludo Party</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="pal-sunset">
  <main>
    <!-- LOGIN -->
    <section id="screen-login" class="screen active">
      <h1 class="logo"><span>L</span><span>U</span><span>D</span><span>O</span><em>party!</em></h1>
      <p class="tagline">Roll. Race. Bonk your friends.</p>
      <form id="login-form" class="card" autocomplete="on">
        <label>Secret name
          <input id="login-user" autocomplete="username" spellcheck="false" required>
        </label>
        <label>Password
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn big cta" type="submit">Let's go!</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <!-- HOME -->
    <section id="screen-home" class="screen">
      <header class="topbar">
        <h1 class="logo small" aria-label="Ludo"><span>L</span><span>U</span><span>D</span><span>O</span></h1>
        <button id="btn-me" class="avatar-btn" type="button" aria-label="Your profile and colours"><span id="me-avatar"></span></button>
      </header>
      <p id="hello" class="hello"></p>
      <div id="rival" class="card rival"></div>
      <button id="btn-create" class="btn big cta" type="button" data-icon="dice">New game</button>
      <div class="join-row">
        <input id="join-code" placeholder="Got a code?" aria-label="Room code" maxlength="6" autocomplete="off" spellcheck="false">
        <button id="btn-join" class="btn" type="button">Join</button>
      </div>
      <button id="btn-cpu" class="link" type="button">Practice against a bot</button>
      <p id="home-error" class="error light" role="alert"></p>
    </section>

    <!-- ROOM -->
    <section id="screen-room" class="screen">
      <header class="topbar">
        <button id="btn-room-back" class="icon-btn" type="button" aria-label="Leave room" data-icon="back"></button>
        <h2 id="room-title" class="title">Your room</h2>
      </header>
      <div id="code-card" class="card code-card">
        <p id="code-hint">Send this code to your friends</p>
        <div class="code-row"><div id="room-code" class="code"></div><button id="btn-share" class="icon-btn" type="button" aria-label="Share invite link" data-icon="share"></button></div>
      </div>
      <div id="seats" class="seats" aria-live="polite"></div>
      <label id="teams-row" class="toggle">
        <input id="teams" type="checkbox">
        <span class="sw" aria-hidden="true"></span>
        <span>Teams, 2 v 2<small id="teams-hint">Turns on with 4 players</small></span>
      </label>
      <button id="btn-start" class="btn big cta" type="button">Start game</button>
      <p id="room-wait" class="room-wait" hidden></p>
      <p id="room-error" class="error light" role="alert"></p>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="game-top">
        <button id="btn-leave" class="icon-btn" type="button" aria-label="Leave game" data-icon="x"></button>
        <div class="corner" data-corner="tl"></div>
        <div class="corner right" data-corner="tr"></div>
        <button id="btn-mute" class="icon-btn" type="button" aria-label="Sound on or off" data-icon="volume"></button>
      </header>
      <div id="board-wrap" class="board-wrap">
        <div id="board" class="board">
          <svg id="board-svg" viewBox="0 0 15 15" aria-hidden="true"></svg>
          <div id="tokens"></div>
        </div>
        <div id="board-label" class="board-label" aria-live="polite"></div>
      </div>
      <div class="dock">
        <button id="dice" class="dice-btn" type="button" aria-label="Roll the dice"><div id="dice-cube" class="dice"></div></button>
        <p id="status" class="status" aria-live="polite"></p>
        <div class="corner right" data-corner="br"></div>
      </div>
      <div class="tools">
        <button id="btn-chat" class="say" type="button" data-icon="chat"><span>Message…</span><b id="unread" class="badge" hidden></b></button>
        <button id="btn-emote" class="icon-btn" type="button" aria-label="React with an emoji" data-icon="smile"></button>
        <button id="btn-mic" class="icon-btn mic" type="button" aria-label="Hold to talk" data-icon="mic"></button>
      </div>
      <div id="wheel" class="wheel" role="menu" aria-label="Reactions"></div>
    </section>
  </main>

  <!-- CHAT -->
  <div id="chat" class="sheet" hidden>
    <div class="grab" aria-hidden="true"></div>
    <header><b>Chat</b><button id="btn-chat-close" class="icon-btn sm" type="button" aria-label="Close chat" data-icon="x"></button></header>
    <div id="msgs" class="msgs" aria-live="polite"></div>
    <div id="quick" class="quick"></div>
    <form id="chat-form" class="compose" autocomplete="off">
      <input id="chat-input" aria-label="Message" placeholder="Message…" maxlength="300">
      <button class="icon-btn send" type="submit" aria-label="Send" data-icon="send"></button>
      <button id="btn-mic2" class="icon-btn mic" type="button" aria-label="Hold to talk" data-icon="mic"></button>
    </form>
  </div>

  <!-- PROFILE -->
  <div id="me-sheet" class="sheet small" hidden>
    <div class="grab" aria-hidden="true"></div>
    <header><b>You</b><button id="btn-me-close" class="icon-btn sm" type="button" aria-label="Close" data-icon="x"></button></header>
    <div class="me-body">
      <h3>Avatar</h3>
      <div id="avatars" class="avatars" role="group" aria-label="Avatar"></div>
      <h3>Colours</h3>
      <div id="palettes" class="palettes" role="group" aria-label="Colours"></div>
      <button id="btn-logout" class="btn ghost" type="button">Log out</button>
    </div>
  </div>

  <!-- WIN -->
  <div id="win" class="overlay" hidden>
    <div class="card win-card">
      <div id="dancers" class="dancers" aria-hidden="true"></div>
      <div class="trophy" data-icon="trophy" aria-hidden="true"></div>
      <h2 id="win-title"></h2>
      <p id="win-vs" class="win-vs"></p>
      <div id="win-stats" class="stats"></div>
      <div class="row">
        <button id="btn-again" class="btn cta" type="button">Rematch</button>
        <button id="btn-win-leave" class="btn" type="button">Home</button>
      </div>
      <p id="win-wait" class="win-wait" hidden></p>
    </div>
  </div>

  <div id="rec" class="rec" aria-live="polite"><i></i><span>Recording… let go to send</span></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="fx"></div>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="rules.js?v=4"></script>
  <script src="game.js?v=4"></script>
  <script src="social.js?v=4"></script>
</body>
</html>
